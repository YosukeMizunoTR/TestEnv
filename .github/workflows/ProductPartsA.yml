name: Model verification example for the CruiseControlMode model

on:
  # Triggers the workflow on push events but only for the main branch
  push:
    paths:
      - 'Test/Sample/ctrl/ctrldesign/parts/SamplePartsA/**/*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  MATLAB_EXE: C:\Program Files\MATLAB\R2023a\bin\matlab.exe
  MODELNAME: SamplePartsA
  MODELPATH: C:\Users\C9166\actions-runner\_work\TestEnv\TestEnv\Test\Sample\ctrl\ctrldesign\parts\SamplePartsA

jobs:
  code:
    runs-on: self-hosted
    steps:
      - name: Check Code
        shell: cmd
        run: |
          chcp

  checkout:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
  setup:
    needs: [checkout]
    runs-on: self-hosted
    steps:
      - name: Model Setup
        shell: cmd
        run: |
          echo こんにちは
          chcp 65001
          echo こんにちは
          "%MATLAB_EXE%" -batch "feature('DefaultCharacterSet','UTF8'); disp('こんにちは'); feature('locale'), addpath('C:\Users\C9166\actions-runner\_work\TestEnv\TestEnv\tool');, trse_ci_trrc();, trse_ci_mdlenv('${{ env.MODELPATH }}','${{ env.MODELNAME }}');"

  mdlchk:
    runs-on: self-hosted
    needs: [setup]
    steps:
      - name: Run ModelAdvisor
        shell: cmd
        run: |
          "%MATLAB_EXE%" -batch "addpath('C:\Users\C9166\actions-runner\_work\TestEnv\TestEnv\tool');, trse_ci_trrc();, trse_ci_mdlchk('${{ env.MODELPATH }}','${{ env.MODELNAME }}');"