name: Model verification example for the CruiseControlMode model

on:
  # Triggers the workflow on push events but only for the main branch
  push:
    paths:
      - 'Test/Sample/ctrl/ctrldesign/parts/SamplePartsA/**/*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  ##############
  ###環境情報###
  ##############
  MATLAB_EXE: C:/Program Files/MATLAB/R2023a/bin/matlab.exe

  
  ######################
  ###ユーザーカスタム###
  ######################
  #評価するモデル名(拡張子不要)
  MODELNAME: SamplePartsA
  
  #評価するモデルのフルパス(リポジトリ最上位フォルダを含まないフルパス)
  MODELPATH: Test/Sample/ctrl/ctrldesign/parts/SamplePartsA
  
  #本ymlから呼びたいスクリプトのパスを指定する。(リポジトリ最上位フォルダを含まないフルパス)
  SCRIPTPATH: tool
  
  #アーティファクトのファイル名
  MODELCHKREPORT: SamplePartsA_mdlchkreport


jobs:
  checkout:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
  setup:
    needs: [checkout]
    runs-on: self-hosted
    steps:
      - name: Model Setup
        shell: cmd
        run: |
          chcp
          echo こんにちは
          chcp 65001
          echo こんにちは
          "%MATLAB_EXE%" -batch "feature('DefaultCharacterSet','UTF8'); disp('こんにちは'); feature('locale')"

  mdlchk:
    runs-on: self-hosted
    needs: [setup]
    steps:
      - name: Run ModelAdvisor
        shell: cmd
        run: |
          "%MATLAB_EXE%" -batch "addpath(fullfile( pwd,'${{ env.SCRIPTPATH }}'));, trse_ci_trrc();, trse_ci_mdlchk(fullfile( pwd,'${{ env.MODELPATH }}'),'${{ env.MODELNAME }}');"

  report_mdlchk:
    runs-on: self-hosted
    needs: [mdlchk]
    steps:
      - name: ModelAdvisor Report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODELCHKREPORT }}
          path: ./Test/Sample/ctrl/ctrldesign/parts/SamplePartsA/work/alltest/mdlchk